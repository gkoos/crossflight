<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 320" width="560" height="320" font-family="ui-monospace, 'Cascadia Code', 'Source Code Pro', monospace" font-size="13">
  <style>
    text { fill: #24292f; }
    .label { fill: #57606a; font-size: 11px; }
    .title { font-weight: 600; font-size: 13px; }
    .sub { font-size: 11px; fill: #57606a; }
    .crossflight { fill: #ddf4ff; stroke: #0969da; stroke-width: 2; }
    .adapter { fill: #fff8c5; stroke: #d4a72c; stroke-width: 1.5; }
    .coordinator { fill: #f3f0ff; stroke: #7c3aed; stroke-width: 1.5; }
    .backend { fill: #f6f8fa; stroke: #d0d7de; stroke-width: 1.5; }
    .arrow { stroke: #57606a; stroke-width: 1.5; fill: none; marker-end: url(#ah); }
    @media (prefers-color-scheme: dark) {
      text { fill: #e6edf3; }
      .label { fill: #8b949e; }
      .sub { fill: #8b949e; }
      .crossflight { fill: #051d30; stroke: #388bfd; }
      .adapter { fill: #2d2208; stroke: #d4a72c; }
      .coordinator { fill: #1a0f30; stroke: #a371f7; }
      .backend { fill: #161b22; stroke: #30363d; }
      .arrow { stroke: #8b949e; }
    }
  </style>
  <defs>
    <marker id="ah" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#57606a" />
    </marker>
  </defs>

  <!-- Crossflight top box -->
  <rect x="120" y="20" width="320" height="64" rx="6" class="crossflight"/>
  <text x="280" y="46" text-anchor="middle" class="title">Crossflight</text>
  <text x="280" y="64" text-anchor="middle" class="sub">wrap(key, loader) → coalesces misses</text>

  <!-- arrows down from crossflight -->
  <line x1="200" y1="84" x2="200" y2="116" class="arrow"/>
  <line x1="360" y1="84" x2="360" y2="116" class="arrow"/>

  <!-- CacheAdapter box -->
  <rect x="80" y="116" width="240" height="70" rx="5" class="adapter"/>
  <text x="200" y="138" text-anchor="middle" class="title">CacheAdapter</text>
  <text x="200" y="156" text-anchor="middle" class="sub">get(key)</text>
  <text x="200" y="172" text-anchor="middle" class="sub">set(key, value, options?)</text>

  <!-- Coordinator box -->
  <rect x="340" y="116" width="180" height="70" rx="5" class="coordinator"/>
  <text x="430" y="138" text-anchor="middle" class="title">Coordinator</text>
  <text x="430" y="156" text-anchor="middle" class="sub">acquire(key)</text>
  <text x="430" y="172" text-anchor="middle" class="sub">waitForChange(key)</text>

  <!-- arrows down from adapters -->
  <line x1="200" y1="186" x2="200" y2="218" class="arrow"/>
  <line x1="430" y1="186" x2="430" y2="218" class="arrow"/>

  <!-- Your cache box -->
  <rect x="40" y="218" width="320" height="76" rx="5" class="backend"/>
  <text x="200" y="244" text-anchor="middle" class="title">Your cache</text>
  <text x="200" y="262" text-anchor="middle" class="sub">cache-manager · Keyv · Cacheable</text>
  <text x="200" y="278" text-anchor="middle" class="sub">or any custom CacheAdapter</text>

  <!-- Redis / coordinator box -->
  <rect x="370" y="218" width="160" height="76" rx="5" class="backend"/>
  <text x="450" y="244" text-anchor="middle" class="title">Redis</text>
  <text x="450" y="262" text-anchor="middle" class="sub">or any custom</text>
  <text x="450" y="278" text-anchor="middle" class="sub">Coordinator</text>
</svg>
