<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 240" font-family="ui-monospace, 'Cascadia Code', 'Source Code Pro', monospace" font-size="12">
  <style>
    text { fill: #24292f; }
    .label { fill: #57606a; font-size: 11px; }
    .node-label { fill: #57606a; font-size: 10px; font-weight: 600; }
    .box { fill: #fff8c5; stroke: #d4a72c; stroke-width: 1.5; }
    .hit { fill: #dafbe1; stroke: #2da44e; stroke-width: 1.5; }
    .join { fill: #ddf4ff; stroke: #0969da; stroke-width: 1.5; }
    .miss { fill: #ffebe9; stroke: #cf222e; stroke-width: 1.5; }
    .arrow { stroke: #57606a; stroke-width: 1.5; fill: none; marker-end: url(#ah); }
    .dashed { stroke: #57606a; stroke-width: 1.5; stroke-dasharray: 4,3; fill: none; marker-end: url(#ah); }
    @media (prefers-color-scheme: dark) {
      text { fill: #e6edf3; }
      .label { fill: #8b949e; }
      .node-label { fill: #8b949e; }
      .box { fill: #2d2208; stroke: #d4a72c; }
      .hit { fill: #0f2d18; stroke: #3fb950; }
      .join { fill: #051d30; stroke: #388bfd; }
      .miss { fill: #2d0f0f; stroke: #f85149; }
      .arrow { stroke: #8b949e; }
      .dashed { stroke: #8b949e; }
    }
  </style>
  <defs>
    <marker id="ah" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#57606a" />
    </marker>
  </defs>

  <!-- Node labels -->
  <text x="12" y="30" class="node-label">Node A</text>
  <text x="12" y="100" class="node-label">Node B</text>
  <text x="12" y="170" class="node-label">Node C</text>

  <!-- Caller sub-labels -->
  <text x="20" y="54" class="label">caller 1</text>
  <text x="20" y="74" class="label">caller 2</text>
  <text x="20" y="124" class="label">caller 1</text>
  <text x="20" y="144" class="label">caller 2</text>
  <text x="20" y="194" class="label">caller 1</text>
  <text x="20" y="214" class="label">caller 2</text>

  <!-- miss boxes -->
  <rect x="90" y="40" width="40" height="20" rx="3" class="miss"/>
  <text x="110" y="54" text-anchor="middle">miss</text>
  <rect x="90" y="60" width="40" height="20" rx="3" class="miss"/>
  <text x="110" y="74" text-anchor="middle">miss</text>
  <rect x="90" y="110" width="40" height="20" rx="3" class="miss"/>
  <text x="110" y="124" text-anchor="middle">miss</text>
  <rect x="90" y="130" width="40" height="20" rx="3" class="miss"/>
  <text x="110" y="144" text-anchor="middle">miss</text>
  <rect x="90" y="180" width="40" height="20" rx="3" class="miss"/>
  <text x="110" y="194" text-anchor="middle">miss</text>
  <rect x="90" y="200" width="40" height="20" rx="3" class="miss"/>
  <text x="110" y="214" text-anchor="middle">miss</text>

  <!-- Node A: caller 1 runs loader, caller 2 joins -->
  <rect x="178" y="40" width="90" height="20" rx="3" class="box"/>
  <text x="223" y="54" text-anchor="middle">loadUser()</text>
  <rect x="178" y="60" width="90" height="20" rx="3" class="join"/>
  <text x="223" y="74" text-anchor="middle">joins flight</text>

  <!-- Node B: STILL runs loader (no cross-process coalescing) -->
  <rect x="178" y="110" width="90" height="20" rx="3" class="box"/>
  <text x="223" y="124" text-anchor="middle">loadUser()</text>
  <rect x="178" y="130" width="90" height="20" rx="3" class="join"/>
  <text x="223" y="144" text-anchor="middle">joins flight</text>

  <!-- Node C: STILL runs loader -->
  <rect x="178" y="180" width="90" height="20" rx="3" class="box"/>
  <text x="223" y="194" text-anchor="middle">loadUser()</text>
  <rect x="178" y="200" width="90" height="20" rx="3" class="join"/>
  <text x="223" y="214" text-anchor="middle">joins flight</text>

  <!-- cache writes for each node -->
  <rect x="316" y="40" width="90" height="20" rx="3" class="box"/>
  <text x="361" y="54" text-anchor="middle">cache write</text>
  <rect x="316" y="110" width="90" height="20" rx="3" class="box"/>
  <text x="361" y="124" text-anchor="middle">cache write</text>
  <rect x="316" y="180" width="90" height="20" rx="3" class="box"/>
  <text x="361" y="194" text-anchor="middle">cache write</text>

  <!-- result boxes -->
  <rect x="454" y="40" width="52" height="20" rx="3" class="hit"/>
  <text x="480" y="54" text-anchor="middle">result</text>
  <rect x="454" y="60" width="52" height="20" rx="3" class="hit"/>
  <text x="480" y="74" text-anchor="middle">result</text>
  <rect x="454" y="110" width="52" height="20" rx="3" class="hit"/>
  <text x="480" y="124" text-anchor="middle">result</text>
  <rect x="454" y="130" width="52" height="20" rx="3" class="hit"/>
  <text x="480" y="144" text-anchor="middle">result</text>
  <rect x="454" y="180" width="52" height="20" rx="3" class="hit"/>
  <text x="480" y="194" text-anchor="middle">result</text>
  <rect x="454" y="200" width="52" height="20" rx="3" class="hit"/>
  <text x="480" y="214" text-anchor="middle">result</text>

  <!-- arrows -->
  <line x1="72" y1="50" x2="88" y2="50" class="arrow"/>
  <line x1="72" y1="70" x2="88" y2="70" class="arrow"/>
  <line x1="72" y1="120" x2="88" y2="120" class="arrow"/>
  <line x1="72" y1="140" x2="88" y2="140" class="arrow"/>
  <line x1="72" y1="190" x2="88" y2="190" class="arrow"/>
  <line x1="72" y1="210" x2="88" y2="210" class="arrow"/>

  <line x1="130" y1="50" x2="176" y2="50" class="arrow"/>
  <line x1="130" y1="70" x2="176" y2="70" class="arrow"/>
  <line x1="130" y1="120" x2="176" y2="120" class="arrow"/>
  <line x1="130" y1="140" x2="176" y2="140" class="arrow"/>
  <line x1="130" y1="190" x2="176" y2="190" class="arrow"/>
  <line x1="130" y1="210" x2="176" y2="210" class="arrow"/>

  <!-- loader → cache write (nodes A, B, C) -->
  <line x1="268" y1="50" x2="314" y2="50" class="arrow"/>
  <line x1="268" y1="120" x2="314" y2="120" class="arrow"/>
  <line x1="268" y1="190" x2="314" y2="190" class="arrow"/>

  <!-- joins flight → result (dashed bypass) -->
  <line x1="268" y1="70" x2="452" y2="70" class="dashed"/>
  <line x1="268" y1="140" x2="452" y2="140" class="dashed"/>
  <line x1="268" y1="210" x2="452" y2="210" class="dashed"/>

  <!-- cache write → result -->
  <line x1="406" y1="50" x2="452" y2="50" class="arrow"/>
  <line x1="406" y1="120" x2="452" y2="120" class="arrow"/>
  <line x1="406" y1="190" x2="452" y2="190" class="arrow"/>

  <!-- separator lines between nodes -->
  <line x1="8" y1="92" x2="520" y2="92" stroke="#d0d7de" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="8" y1="162" x2="520" y2="162" stroke="#d0d7de" stroke-width="1" stroke-dasharray="4,3"/>

  <!-- 3x label -->
  <text x="555" y="130" font-size="28" font-weight="700" fill="#cf222e">×3</text>
  <text x="545" y="150" font-size="11" fill="#57606a">loader calls</text>
</svg>
